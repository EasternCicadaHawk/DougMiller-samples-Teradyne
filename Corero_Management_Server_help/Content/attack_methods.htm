        <h1><a name="aanchor157"></a>
            <MadCap:concept term="Explanations" />Attack Methods</h1>
        <p>While there are many different specific attacks, most fall broadly into one of a small number of basic types or methods. These include:</p>
        <ul>
            <li value="1">Volumetric attacks</li>
            <li value="2">Flood attacks</li>
            <li value="3">Reflection attacks</li>
            <li value="4">Amplification attacks</li>
        </ul>

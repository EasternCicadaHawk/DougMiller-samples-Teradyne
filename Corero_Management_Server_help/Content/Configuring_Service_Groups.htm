        <h1><a name="aanchor169"></a>
            <MadCap:concept term="How to" />Configuring Protection Groups</h1>
        <p>Create a new protection group by clicking <b>Add</b> in the Protection Groups pane. Type a name for the new protection group and click <b>Create</b> to add it to the configuration.</p>
        <p>Add an existing <span class="VariablesPlatformNameShort">appliance</span> cluster to the protection group.</p>

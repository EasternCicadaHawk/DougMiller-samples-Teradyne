        <h1><a name="aanchor123"></a>
            <MadCap:concept term="Explanations" />Mitigate Mode</h1>
        <p>When an <span class="VariablesPlatformNameShort">appliance</span> or cluster's Bypass mode is set to Mitigate, incoming traffic is inspected, logged, and treated as required an applicable server protection instance.</p>

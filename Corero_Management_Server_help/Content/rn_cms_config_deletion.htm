        <h1><span class="VariablesApplicationNameShort">CMS</span> allows deletion of the entire configuration</h1>
        <p>Deleting a configuration using the <span class="CLIcommand">delete</span> CLI command removes the entire configuration, including the admin user account, subsequently locking out any access to the <span class="VariablesApplicationNameShort">CMS</span>.</p>
